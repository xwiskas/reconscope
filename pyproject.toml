[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconscope"
version = "0.1.0"
description = "Local, browser-based ethical-hacking reconnaissance learning workbench"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Sebastian" }]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "idna>=3.7",
    "httpx>=0.27",
    "dnspython>=2.6",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
build = [
    "pyinstaller>=6.6",
]

[project.scripts]
reconscope = "reconscope.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reconscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# (str, Enum) is a deliberate choice for explicit JSON value serialization.
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom uses these in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
